[package]
name = "trading_node"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
nautilus-core = "0.55.0"
nautilus-model = "0.55.0"
nautilus-common = "0.55.0"
nautilus-trading = "0.55.0"
nautilus-binance = "0.55.0"
nautilus-okx = "0.55.0"
message_bus = { path = "../common/message_bus" }
ws_client = { path = "../common/ws_client" }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
salvo = { version = "0.92.2", features = ["affix-state"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
