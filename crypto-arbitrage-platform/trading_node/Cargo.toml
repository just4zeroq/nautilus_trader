[package]
name = "trading_node"
version = "0.1.0"
edition = "2021"

[dependencies]
nautilus-core = { path = "../../nautilus_trader/crates/core" }
nautilus-model = { path = "../../nautilus_trader/crates/model" }
nautilus-common = { path = "../../nautilus_trader/crates/common" }
nautilus-trading = { path = "../../nautilus_trader/crates/trading" }
nautilus-binance = { path = "../../nautilus_trader/crates/adapters/binance" }
nautilus-okx = { path = "../../nautilus_trader/crates/adapters/okx" }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
tracing = "0.1"
anyhow = "1.0"
