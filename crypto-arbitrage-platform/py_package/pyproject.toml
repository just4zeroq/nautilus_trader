[project]
name = "crypto-arbitrage-py"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "websockets>=12.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "redis>=5.0",
    "nautilus_trader>=1.224",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
