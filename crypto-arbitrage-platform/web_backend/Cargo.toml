[package]
name = "web_backend"
version = "0.1.0"
edition = "2021"

[dependencies]
salvo = { version = "0.68", features = ["affix", "cookie", "jwt", "websocket"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
jsonwebtoken = "9.0"
bcrypt = "0.15"
dotenvy = "0.15"
