[package]
name = "web_backend"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
message_bus = { path = "../common/message_bus" }
salvo = { version = "0.92.2", features = ["websocket", "affix-state"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
jsonwebtoken = "10.3.0"
bcrypt = "0.19.0"
dotenvy = "0.15"
uuid = { version = "1.0", features = ["v4"] }
