[workspace]

[package]
name = "message_bus"
version = "0.1.0"
edition = "2021"
description = "Unified Redis Streams message bus for crypto arbitrage platform"

[dependencies]
redis = { version = "0.25", features = ["streams", "aio", "tokio-comp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.0", features = ["sync"] }
tracing = "0.1"
