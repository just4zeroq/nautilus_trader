[package]
name = "collector"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
nautilus-core = "0.55.0"
nautilus-model = "0.55.0"
nautilus-common = "0.55.0"
nautilus-data = "0.55.0"
nautilus-binance = "0.55.0"
nautilus-okx = "0.55.0"
message_bus = { path = "../common/message_bus" }
ws_client = { path = "../common/ws_client" }
tokio = { version = "1.0", features = ["full"] }
redis = { version = "0.25", features = ["streams", "aio", "tokio-comp"] }
bytes = "1.0"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tracing = "0.1"
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }

[[bin]]
name = "collector"
path = "src/main.rs"
