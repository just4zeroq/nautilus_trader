[package]
name = "collector"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
nautilus-core = { path = "../../crates/core" }
nautilus-model = { path = "../../crates/model" }
nautilus-common = { path = "../../crates/common" }
nautilus-data = { path = "../../crates/data" }
nautilus-binance = { path = "../../crates/adapters/binance" }
nautilus-okx = { path = "../../crates/adapters/okx" }
tokio = { version = "1.0", features = ["full"] }
redis = { version = "0.25", features = ["streams"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
tracing = "0.1"
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
